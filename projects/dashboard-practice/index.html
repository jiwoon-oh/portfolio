<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>매출 성장 모니터 — 리테일 분석</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#132A22;
  --grocer:#1F4E3D;
  --grocer-soft:#E4EBE6;
  --tag:#B8422E;
  --tag-soft:#F6E7E2;
  --gain:#2F7D5C;
  --amber:#C08419;
  --amber-soft:#FAF0DC;
  --paper:#F1F3F1;
  --card:#FFFFFF;
  --rule:#DCE2DE;
  --mute:#65756D;
  --side-w:216px;
  --topbar-h:60px;
  --cond:"Barlow Condensed",'IBM Plex Sans KR',sans-serif;
  --sans:"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,sans-serif;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased;
  word-break:keep-all;overflow-wrap:break-word;
}
button{font-family:inherit}
::selection{background:var(--grocer);color:#fff}

/* ============ layout shell ============ */
.shell{display:flex;min-height:100vh}

/* ---- sidebar ---- */
.side{
  width:var(--side-w);flex:0 0 var(--side-w);background:var(--ink);color:#fff;
  display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:30;
  transition:transform .25s ease;
}
.side .brand{padding:22px 20px 16px;border-bottom:1px solid rgba(255,255,255,.12)}
.side .brand b{display:block;font-size:15.5px;font-weight:700;letter-spacing:-.01em}
.side .brand span{display:block;font-size:11.5px;color:#9FB0A6;margin-top:3px}
.nav{padding:14px 10px;display:flex;flex-direction:column;gap:2px}
.nav button{
  all:unset;display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:3px;
  font-size:13.5px;font-weight:500;color:#CBD6CF;cursor:pointer;
}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button.active{background:var(--grocer);color:#fff;font-weight:600}
